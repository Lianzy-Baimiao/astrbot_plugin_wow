<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #141519; }
body { width: 880px; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #ECEDF2; -webkit-font-smoothing: antialiased; }
.root { width: 880px; background: #141519; }
.band { height: 96px; position: relative; background: linear-gradient(90deg, #b08a3a 0%, #6a5520 55%, #141519 100%); }
.band-top { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #FFC14D; }
.h-title { position: absolute; left: 28px; top: 44px; transform: translateY(-50%); font-size: 30px; font-weight: 800; color: #fff; }
.h-sub { position: absolute; left: 28px; top: 74px; transform: translateY(-50%); font-size: 15px; color: rgba(255,255,255,.67); }
.rows { padding: 4px 0 4px; }
.row { display: flex; align-items: center; height: 46px; padding: 0 22px; }
.row:nth-child(odd) { background: rgba(255,255,255,.10); border-radius: 6px; }
.rank { width: 44px; text-align: center; font-size: 24px; font-weight: 800; flex-shrink: 0; }
.r-gold { color: #FFC14D; } .r-silver { color: #C8CDD7; }
.r-bronze { color: #CDA06E; } .r-plain { color: #8C8F9B; }
.main { flex: 1; min-width: 0; }
.nick { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt { font-size: 14px; color: #727482; margin-top: 2px; }
.score { width: 110px; text-align: right; font-size: 20px; font-weight: 800; color: #86CF96; flex-shrink: 0; }
.foot { margin: 12px 24px 0; padding: 10px 0 14px; text-align: center; border-top: 1px solid rgba(255,255,255,.05); font-size: 12px; color: #727482; }
</style>
</head>
<body>
<div class="root">
  <div class="band">
    <div class="band-top"></div>
    <div class="h-title">本群红手榜 TOP {{ rows|length }}</div>
    <div class="h-sub">红手积分排行 · 开箱越多积分越高</div>
  </div>
  <div class="rows">
    {% for r in rows %}
    <div class="row">
      <div class="rank {% if loop.index == 1 %}r-gold{% elif loop.index == 2 %}r-silver{% elif loop.index == 3 %}r-bronze{% else %}r-plain{% endif %}">{{ loop.index }}</div>
      <div class="main">
        <div class="nick">{{ r.nick or r.uid }}</div>
        <div class="cnt">开箱 {{ r.count }} 次</div>
      </div>
      <div class="score">{{ "{:,}".format(r.score) }} 分</div>
    </div>
    {% endfor %}
  </div>
  <div class="foot">本榜仅限本群 · 娱乐向</div>
</div>
</body>
</html>
