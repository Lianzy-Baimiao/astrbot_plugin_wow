<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #141519; }
body {
  width: 800px;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: #ECEDF2; -webkit-font-smoothing: antialiased;
}
.page { width: 800px; background: #141519; padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 32px; background: linear-gradient(135deg, #1F2A44, #3A4B6E); }
.brand-tag { font-size: 15px; font-weight: 800; color: #FFC14D; letter-spacing: 2px; }
.brand-name { font-size: 14px; color: rgba(255,255,255,.75); }
.banner {
  width: 100%; height: 200px; display: block; object-fit: cover; object-position: center;
  background: linear-gradient(135deg, #1F2A44, #3A4B6E); /* 图片加载失败时兜底 */
}
.banner-empty {
  height: 140px; background: linear-gradient(135deg, #1F2A44, #3A4B6E);
  display: flex; flex-direction: column; justify-content: center; padding: 0 32px;
}
.banner-empty .big { font-size: 26px; font-weight: 800; color: #FFFFFF; letter-spacing: 1px; line-height: 1.4; word-break: break-word; }
.banner-empty .sub { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.6); }
.article { padding: 24px 32px 0; }
.art-title { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: 1px; line-height: 1.45; word-break: break-word; }
.art-divider { height: 1px; background: rgba(255,255,255,.08); margin: 16px 0; }
.desc-block { padding: 0 32px; }
.art-desc { font-size: 16px; color: #ECEDF2; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }
.link-block { padding: 0 32px; }
.art-link {
  margin: 16px 0 0; font-size: 13px; color: #8CB2F0;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
  border-radius: 8px; padding: 12px 16px;
  word-break: break-all; line-height: 1.6;
}
.foot { padding: 14px 32px 0; font-size: 13px; color: #727482; text-align: right; }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <span class="brand-tag">魔兽世界官方新闻</span>
    <span class="brand-name">wow.blizzard.cn</span>
  </div>
  {% if news.image_url %}
  <img class="banner" src="{{ news.image_url }}">
  <div class="article">
    <div class="art-title">{{ news.title }}</div>
    <div class="art-divider"></div>
  </div>
  {% else %}
  <div class="banner banner-empty">
    <div class="big">{{ news.title }}</div>
    <div class="sub">魔兽世界 官方新闻公告</div>
  </div>
  {% endif %}
  {% if news.description %}
  <div class="desc-block">
    <div class="art-desc">{{ news.description }}</div>
    <div class="art-divider"></div>
  </div>
  {% endif %}
  {% if news.url %}
  <div class="link-block">
    <div class="art-link">原文链接：{{ news.url }}</div>
  </div>
  {% endif %}
  <div class="foot">来源：wow.blizzard.cn · 最新官方新闻</div>
</div>
</body>
</html>
